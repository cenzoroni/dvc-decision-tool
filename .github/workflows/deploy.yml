name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      # Stamp the footer with what is being shipped, after the tests have
      # run against the untouched file. The placeholder reads "dev" locally.
      - name: Stamp build
        run: |
          sed -i "s|<span id=\"build\">dev</span>|<span id=\"build\">${GITHUB_SHA::7} · $(date -u +'%Y-%m-%d %H:%M') UTC</span>|" index.html
          grep -q "id=\"build\">${GITHUB_SHA::7}" index.html

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting:dvc --project altavilla-dev --non-interactive
